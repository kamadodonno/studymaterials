name: Build iOS IPA for iPad Air (iOS 12.5.7)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build StudyMaterials.ipa
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build App with Xcodebuild
        run: |
          echo "Active Xcode: $(xcode-select -p)"
          cd ios
          mkdir -p build/Payload
          
          # Build .app payload with xcodebuild
          xcodebuild clean build \
            -project StudyMaterials.xcodeproj \
            -target StudyMaterials \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER=""

          # Locate built .app
          APP_PATH=$(find build/DerivedData -name "StudyMaterials.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/DerivedData -name "*.app" -type d | head -n 1)
          fi
          echo "Found app at: $APP_PATH"

          # Package into .ipa
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r ../StudyMaterials.ipa Payload
          cd ..
          echo "IPA generation complete: $(ls -lh StudyMaterials.ipa)"

      - name: Upload StudyMaterials.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyMaterials-iPad-Air-iOS12
          path: ios/StudyMaterials.ipa
          retention-days: 30
